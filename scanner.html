
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Scan QR - Check-in Acara</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 12px #00000012;
    }

    h1 { font-size: 22px; margin-top: 0; }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input, button {
    /*  width: 100%; */
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 8px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      cursor: pointer;
      background: #1d4ed8;
      color: white;
      font-weight: 600;
    }

    button:disabled { opacity: .5; }

    div#manualCheckinPanel {
      margin: 1em 0;
    }
    
    #reader {
      width: 100%;
      margin-top: 16px;
    }

    
    #result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      white-space: pre-line;
      overflow-wrap: anywhere;
      font-weight: 600;
      line-height: 1.6;
    }
    
    #result.success {
      background: #dcfce7 !important;
      color: #166534;
      border-color: #86efac;
    }
    
    #result.warning {
      background: #fef3c7 !important;
      color: #92400e;
      border-color: #fcd34d;
    }
    
    #result.error {
      background: #fee2e2 !important;
      color: #991b1b;
      border-color: #fca5a5;
    }
    
    #showDiagnostics {
      width: auto;
      margin: 0;
    }
    
    .diagnostic-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .small {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>Check-in Peserta</h1>
  <p class="small">
    Isi identitas panitia cukup satu kali, lalu pilih cara Check-in menggunakan Kamera untuk Scan QR ataukah input Participant ID secara manual.
  </p>

  <label for="staffName">Nama panitia</label>
  <input id="staffName" maxlength="100" size="28"
         autocomplete="name" required>

  <label for="pin">PIN panitia</label>
  <input id="pin" type="password" size="15"
         inputmode="numeric" autocomplete="off" required>

  <div class="mode-selector">
    <p><strong>Metode Check-in</strong></p>
  
    <label>
      <input type="radio" name="checkinMode"
        value="QR" checked>
      Scan QR dengan kamera
    </label>
  
    <label>
      <input type="radio" name="checkinMode"
        value="MANUAL">
      Input Participant ID manual
    </label>
  </div>
  
  <div id="manualCheckinPanel" hidden>
    <label for="manualParticipantId">Participant ID</label>
    <input
      id="manualParticipantId"
      type="text"
      placeholder="Contoh: P000013"
      maxlength="7"
      size="12"
      autocomplete="off"
    >
    <button type="button" id="manualCheckinButton">
      Proses Check-in Manual
    </button>
  </div>

  
  <button id="startButton" type="button">
    Aktifkan Kamera
  </button>

  <div id="reader"></div>

  <div id="result" role="status" aria-live="polite">
    Kamera belum diaktifkan.
  </div>

  <button id="restartButton" type="button" hidden>
    Scan Peserta Berikutnya
  </button>

  <!-- p class="small">
    Jika kamera tidak tersedia, gunakan halaman Check-in lama untuk memasukkan token secara manual.
  </p -->
</main>


<div id="adminDiagnostics" hidden>
  <label class="diagnostic-toggle">
    <input type="checkbox" id="showDiagnostics">
    Tampilkan iframe diagnostik
  </label>
  <p class="small">
    Khusus Administrator. Nonaktifkan kembali setelah selesai.
  </p>
</div>


<iframe
  id="checkinResponseFrame"
  name="checkinResponseFrame"
  title="Diagnostik respons server"
  style="width:100%; height:220px; border:1px solid #999;">
</iframe>

<form id="checkinForm"
      method="post"
      target="checkinResponseFrame"
      action="https://script.google.com/macros/s/AKfycbzC7oIumFQ_6bdgaX6AZDengCrODyKBT8NFtmAcMf2ihbAGx4POSYeClSevHsH12Z1e1w/exec"
      hidden>
  <input name="qrToken">
  <input name="pin">
  <input name="staffName">
  <input name="requestId">
  <input type="hidden" name="mode" value="QR">
  <input type="hidden" name="participantId" value="">
</form>


<script>
  const scanner = new Html5Qrcode('reader');

  const startButton = document.getElementById('startButton');
  const restartButton = document.getElementById('restartButton');
  const resultBox = document.getElementById('result');
  const form = document.getElementById('checkinForm');
  
  const adminDiagnostics = document.getElementById('adminDiagnostics');
  const showDiagnostics = document.getElementById('showDiagnostics');
  const responseFrame = document.querySelector(
    'iframe[name="checkinResponseFrame"]'
  );
  
  // Iframe selalu tersembunyi saat halaman pertama kali dibuka.
  if (responseFrame) {
    responseFrame.style.display = 'none';
  }
  
  showDiagnostics.addEventListener('change', function() {
    if (responseFrame) {
      responseFrame.style.display =
        showDiagnostics.checked ? 'block' : 'none';
    }
  });


  let scanning = false;
  let busy = false;
  let activeRequestId = '';
  let responseTimeout = null;
  let activeRequestMode = '';

  function showResult(message, type) {
    resultBox.textContent = message;
    resultBox.className = type || '';
  }

  function makeRequestId() {
    return Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2) + '-' +
      Math.random().toString(36).slice(2);
  }

  async function stopScanner() {
    if (!scanning) return;

    scanning = false;

    try {
      await scanner.stop();
    } catch (error) {
      console.warn('Scanner stop:', error);
    }

    startButton.disabled = false;
  }

  async function submitScannedToken(token) {
    if (busy) return;

    const staffName = document.getElementById('staffName')
      .value.trim();
    const pin = document.getElementById('pin').value;

    if (!staffName || !pin) {
      showResult(
        'Isi nama panitia dan PIN sebelum mulai scan.',
        'error'
      );
      await stopScanner();
      return;
    }

    busy = true;
    await stopScanner();

    activeRequestId = makeRequestId();

    form.elements.qrToken.value = token;
    form.elements.pin.value = pin;
    form.elements.staffName.value = staffName;
    form.elements.requestId.value = activeRequestId;
    
    form.elements.mode.value = 'QR';
    form.elements.participantId.value = '';

    restartButton.hidden = true;

    showResult('QR terbaca. Memvalidasi check-in...', 'warning');

    if (responseTimeout) {
      clearTimeout(responseTimeout);
    }
    
    responseTimeout = setTimeout(function() {
      if (!busy) return;
    
      busy = false;
      activeRequestId = '';
    
      showResult(
        'Belum menerima respons dari server. ' +
        'Periksa koneksi internet dan log eksekusi Apps Script ' +
        'sebelum mencoba scan ulang.',
        'error'
      );
    
      restartButton.hidden = false;
    }, 20000);

    activeRequestMode = 'QR';
    
    // Form POST menghindari kebutuhan membaca respons dengan fetch/CORS.
    // Respons server dikirim kembali melalui postMessage.
    form.requestSubmit
      ? form.requestSubmit()
      : form.submit();
  }

  async function startScanner() {
    if (busy || scanning) return;

    const staffName = document.getElementById('staffName')
      .value.trim();
    const pin = document.getElementById('pin').value;

    if (!staffName || !pin) {
      showResult('Isi nama panitia dan PIN terlebih dahulu.', 'error');
      return;
    }

    if (!window.isSecureContext) {
      showResult('Halaman harus dibuka melalui HTTPS.', 'error');
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      showResult(
        'Pustaka QR gagal dimuat. Periksa koneksi internet dan muat ulang halaman.',
        'error'
      );
      return;
    }

    try {
      startButton.disabled = true;
      showResult('Membuka kamera...', '');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1
        },
        async function(decodedText) {
          // Hanya menerima token QR yang sesuai format sistem.
          if (!/^[a-f0-9]{32}$/i.test(decodedText.trim())) {
            showResult('QR terbaca, tetapi format token tidak valid.', 'error');
            return;
          }

          await submitScannedToken(decodedText.trim());
        },
        function() {
          // Abaikan frame yang belum menghasilkan QR.
        }
      );

      scanning = true;
      showResult('Arahkan kamera ke QR tiket peserta.', '');

    } catch (error) {
      scanning = false;
      startButton.disabled = false;

      showResult(
        'Kamera gagal dibuka: ' +
        (error.message || error.name || 'Kesalahan tidak diketahui'),
        'error'
      );
    }
  }

  
  const manualPanel = document.getElementById('manualCheckinPanel');
  const manualIdInput = document.getElementById('manualParticipantId');
  const manualButton = document.getElementById('manualCheckinButton');
  
  function getSelectedCheckinMode() {
    const selected = document.querySelector(
      'input[name="checkinMode"]:checked'
    );
  
    return selected ? selected.value : 'QR';
  }
  
  document.querySelectorAll('input[name="checkinMode"]').forEach(
    function(radio) {
      radio.addEventListener('change', async function() {
        await stopScanner();
  
        const manualMode = getSelectedCheckinMode() === 'MANUAL';
  
        manualPanel.hidden = !manualMode;
        startButton.hidden = manualMode;
        restartButton.hidden = true;
  
        showResult(
          manualMode
            ? 'Masukkan Participant ID yang tertera pada tiket.'
            : 'Mode kamera aktif. Tekan tombol untuk mulai scan QR.',
          ''
        );
      });
    }
  );
  
  async function submitManualCheckin() {
    if (busy) return;
  
    const participantId = manualIdInput.value.trim().toUpperCase();
    const staffName = document.getElementById('staffName').value.trim();
    const pin = document.getElementById('pin').value;
  
    if (!staffName || !pin) {
      showResult('Isi nama panitia dan PIN terlebih dahulu.', 'error');
      return;
    }
  
    if (!/^P\d{6}$/.test(participantId)) {
      showResult(
        'Participant ID tidak valid. Contoh: P000013.',
        'error'
      );
      return;
    }
  
    busy = true;
    manualButton.disabled = true;
    restartButton.hidden = true;
    activeRequestId = makeRequestId();
  
    form.elements.mode.value = 'MANUAL';
    form.elements.participantId.value = participantId;
    form.elements.qrToken.value = '';
    form.elements.pin.value = pin;
    form.elements.staffName.value = staffName;
    form.elements.requestId.value = activeRequestId;
    
    activeRequestMode = 'MANUAL';
  
    showResult('Memvalidasi Participant ID...', 'warning');
  
    if (responseTimeout) {
      clearTimeout(responseTimeout);
    }
  
    responseTimeout = setTimeout(function() {
      if (!busy) return;
  
      busy = false;
      activeRequestId = '';
      manualButton.disabled = false;
  
      showResult(
        'Belum menerima respons dari server. ' +
        'Periksa koneksi sebelum mencoba kembali.',
        'error'
      );
  
      restartButton.hidden = false;
    }, 20000);
  
    form.requestSubmit ? form.requestSubmit() : form.submit();
  }
  
  manualButton.addEventListener('click', submitManualCheckin);

  
  window.addEventListener('message', function(event) {
    const data = event.data;
  
    if (!data || typeof data !== 'object') return;
  
    const trustedOrigin =
      event.origin === 'https://script.google.com' ||
      event.origin === 'https://script.googleusercontent.com' ||
      event.origin.endsWith('.script.googleusercontent.com') ||
      event.origin.endsWith('.googleusercontent.com');
  
    if (!trustedOrigin) return;
    if (data.requestId !== activeRequestId) return;
  
    if (responseTimeout) {
      clearTimeout(responseTimeout);
      responseTimeout = null;
    }
  
    busy = false;
    activeRequestId = '';
  
    // Iframe disembunyikan kembali setiap kali respons diterima.
    showDiagnostics.checked = false;

    // Ini memastikan tombol "MANUAL" aktif kembali setelah respons diterima.
    if (manualButton) manualButton.disabled = false;
  
    if (responseFrame) {
      responseFrame.style.display = 'none';
    }
  
    // Hanya respons server dengan hak Administrator yang boleh membuka kontrol diagnostik.
    adminDiagnostics.hidden = data.isAdmin !== true;
  
    if (data.status === 'success') {
      showResult(
        'CHECK-IN BERHASIL\n' +
        data.participantName + '\n' +
        data.registrationNo + '\n' +
        'Participant ID: ' + (data.participantId || '-') + '\n' +
        data.checkinAt + '\n' +
        'Panitia: ' + (data.checkedInBy || '-'),
        'success'
      );
        
    } else if (data.status === 'already_checked_in') {
      showResult(
        'SUDAH CHECK-IN\n' +
        data.participantName + '\n' +
        data.registrationNo + '\n' +
        'Participant ID: ' + (data.participantId || '-') + '\n' +
        data.checkinAt + '\n' +
        'Panitia: ' + (data.checkedInBy || 'Tidak diketahui'),
        'warning'
      );
      
    } else {
      showResult(
        data.message || 'Check-in gagal.',
        'error'
      );
    }
  
//  restartButton.hidden = false;
    restartButton.hidden = activeRequestMode !== 'QR';
    activeRequestMode = '';
  });


  startButton.addEventListener('click', startScanner);

  restartButton.addEventListener('click', function() {
    if (getSelectedCheckinMode() !== 'QR') {
      restartButton.hidden = true;
      return;
    }
  
    restartButton.hidden = true;
    showResult('Siap untuk peserta berikutnya.', '');
    startScanner();
  });

  window.addEventListener('pagehide', function() {
    if (scanning) {
      scanner.stop().catch(function() {});
    }
  });
</script>
</body>
</html>
