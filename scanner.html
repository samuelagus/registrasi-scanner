
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Scan QR - Check-in Acara</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 12px #00000012;
    }

    h1 { font-size: 22px; margin-top: 0; }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 8px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      cursor: pointer;
      background: #1d4ed8;
      color: white;
      font-weight: 600;
    }

    button:disabled { opacity: .5; }

    #reader {
      width: 100%;
      margin-top: 16px;
    }

    
    #result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      white-space: pre-line;
      overflow-wrap: anywhere;
      font-weight: 600;
      line-height: 1.6;
    }
    
    #result.success {
      background: #dcfce7 !important;
      color: #166534;
      border-color: #86efac;
    }
    
    #result.warning {
      background: #fef3c7 !important;
      color: #92400e;
      border-color: #fcd34d;
    }
    
    #result.error {
      background: #fee2e2 !important;
      color: #991b1b;
      border-color: #fca5a5;
    }
    
    #showDiagnostics {
      width: auto;
      margin: 0;
    }
    
    .diagnostic-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .small {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>Check-in Peserta</h1>
  <p class="small">
    Isi identitas panitia satu kali. Arahkan kamera ke QR tiket
    untuk memproses check-in.
  </p>

  <label for="staffName">Nama panitia</label>
  <input id="staffName" maxlength="100"
         autocomplete="name" required>

  <label for="pin">PIN panitia</label>
  <input id="pin" type="password"
         inputmode="numeric" autocomplete="off" required>

  <button id="startButton" type="button">
    Aktifkan Kamera
  </button>

  <div id="reader"></div>

  <div id="result" role="status" aria-live="polite">
    Kamera belum diaktifkan.
  </div>

  <button id="restartButton" type="button" hidden>
    Scan Peserta Berikutnya
  </button>

  <p class="small">
    Jika kamera tidak tersedia, gunakan halaman Check-in lama
    untuk memasukkan token secara manual.
  </p>
</main>

<iframe
  id="checkinResponseFrame"
  name="checkinResponseFrame"
  title="Diagnostik respons server"
  style="width:100%; height:220px; border:1px solid #999;">
</iframe>

<form id="checkinForm"
      method="post"
      target="checkinResponseFrame"
      action="https://script.google.com/macros/s/AKfycbzC7oIumFQ_6bdgaX6AZDengCrODyKBT8NFtmAcMf2ihbAGx4POSYeClSevHsH12Z1e1w/exec"
      hidden>
  <input name="qrToken">
  <input name="pin">
  <input name="staffName">
  <input name="requestId">
</form>

<script>
  const scanner = new Html5Qrcode('reader');

  const startButton = document.getElementById('startButton');
  const restartButton = document.getElementById('restartButton');
  const resultBox = document.getElementById('result');
  const form = document.getElementById('checkinForm');

  let scanning = false;
  let busy = false;
  let activeRequestId = '';
  let responseTimeout = null;

  function showResult(message, type) {
    resultBox.textContent = message;
    resultBox.className = type || '';
  }

  function makeRequestId() {
    return Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2) + '-' +
      Math.random().toString(36).slice(2);
  }

  async function stopScanner() {
    if (!scanning) return;

    scanning = false;

    try {
      await scanner.stop();
    } catch (error) {
      console.warn('Scanner stop:', error);
    }

    startButton.disabled = false;
  }

  async function submitScannedToken(token) {
    if (busy) return;

    const staffName = document.getElementById('staffName')
      .value.trim();
    const pin = document.getElementById('pin').value;

    if (!staffName || !pin) {
      showResult(
        'Isi nama panitia dan PIN sebelum mulai scan.',
        'error'
      );
      await stopScanner();
      return;
    }

    busy = true;
    await stopScanner();

    activeRequestId = makeRequestId();

    form.elements.qrToken.value = token;
    form.elements.pin.value = pin;
    form.elements.staffName.value = staffName;
    form.elements.requestId.value = activeRequestId;

    restartButton.hidden = true;

    showResult('QR terbaca. Memvalidasi check-in...', 'warning');

    if (responseTimeout) {
      clearTimeout(responseTimeout);
    }
    
    responseTimeout = setTimeout(function() {
      if (!busy) return;
    
      busy = false;
      activeRequestId = '';
    
      showResult(
        'Belum menerima respons dari server. ' +
        'Periksa koneksi internet dan log eksekusi Apps Script ' +
        'sebelum mencoba scan ulang.',
        'error'
      );
    
      restartButton.hidden = false;
    }, 20000);
      

    // Form POST menghindari kebutuhan membaca respons dengan fetch/CORS.
    // Respons server dikirim kembali melalui postMessage.
    form.requestSubmit
      ? form.requestSubmit()
      : form.submit();
  }

  async function startScanner() {
    if (busy || scanning) return;

    const staffName = document.getElementById('staffName')
      .value.trim();
    const pin = document.getElementById('pin').value;

    if (!staffName || !pin) {
      showResult('Isi nama panitia dan PIN terlebih dahulu.', 'error');
      return;
    }

    if (!window.isSecureContext) {
      showResult('Halaman harus dibuka melalui HTTPS.', 'error');
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      showResult(
        'Pustaka QR gagal dimuat. Periksa koneksi internet dan muat ulang halaman.',
        'error'
      );
      return;
    }

    try {
      startButton.disabled = true;
      showResult('Membuka kamera...', '');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1
        },
        async function(decodedText) {
          // Hanya menerima token QR yang sesuai format sistem.
          if (!/^[a-f0-9]{32}$/i.test(decodedText.trim())) {
            showResult('QR terbaca, tetapi format token tidak valid.', 'error');
            return;
          }

          await submitScannedToken(decodedText.trim());
        },
        function() {
          // Abaikan frame yang belum menghasilkan QR.
        }
      );

      scanning = true;
      showResult('Arahkan kamera ke QR tiket peserta.', '');

    } catch (error) {
      scanning = false;
      startButton.disabled = false;

      showResult(
        'Kamera gagal dibuka: ' +
        (error.message || error.name || 'Kesalahan tidak diketahui'),
        'error'
      );
    }
  }

  
  
  window.addEventListener('message', function(event) {
    const data = event.data;
  
    // DIAGNOSTIK: catat semua pesan yang diterima halaman utama.
    console.log('[CHECKIN DEBUG] Pesan diterima:', {
      origin: event.origin,
      data: data,
      activeRequestId: activeRequestId,
      source: event.source
    });
  
    if (!data || typeof data !== 'object') {
      console.warn('[CHECKIN DEBUG] Pesan bukan object.');
      return;
    }
  
    if (data.requestId !== activeRequestId) {
      console.warn('[CHECKIN DEBUG] Request ID tidak cocok:', {
        received: data.requestId,
        expected: activeRequestId
      });
      return;
    }
  
    
    const trustedOrigin =
      event.origin === 'https://script.google.com' ||
      event.origin === 'https://script.googleusercontent.com' ||
      event.origin.endsWith('.script.googleusercontent.com') ||
      event.origin.endsWith('.googleusercontent.com');

  
    if (!trustedOrigin) {
      console.warn(
        '[CHECKIN DEBUG] Origin tidak dipercaya:',
        event.origin
      );
      return;
    }
  
    if (responseTimeout) {
      clearTimeout(responseTimeout);
      responseTimeout = null;
    }
  
    busy = false;
    activeRequestId = '';
  
    if (data.status === 'success') {
      showResult(
        'CHECK-IN BERHASIL\n' +
        data.participantName + '\n' +
        data.registrationNo + '\n' +
        data.checkinAt,
        'success'
      );
    } else if (data.status === 'already_checked_in') {
      showResult(
        'SUDAH CHECK-IN\n' +
        data.participantName + '\n' +
        data.registrationNo + '\n' +
        data.checkinAt,
        'error'
      );
    } else {
      showResult(data.message || 'Check-in gagal.', 'error');
    }
  
    restartButton.hidden = false;
  });


  startButton.addEventListener('click', startScanner);

  restartButton.addEventListener('click', function() {
    restartButton.hidden = true;
    showResult('Siap untuk peserta berikutnya.', '');
    startScanner();
  });

  window.addEventListener('pagehide', function() {
    if (scanning) {
      scanner.stop().catch(function() {});
    }
  });
</script>
</body>
</html>
